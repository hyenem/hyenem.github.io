<text x="1610.6" y="79.7" font-size="18.0" font-weight="700" fill="rgb(0, 116, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.72" xml:space="preserve">SECURITY · 정품 증명</text>
<text x="88.0" y="75.8" font-size="20.0" font-weight="600" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">S08 · 보안 ① 누가 접속하나</text>
<text x="88.0" y="122.3" font-size="44.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" letter-spacing="-0.97" xml:space="preserve">아무나 서버를 두드리면 어떡하지? — 정품만 통과</text>
<text x="88.0" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">비싼 AI 서버에 가짜·루팅폰·짝퉁 버즈가 몰리면 비용도 보안도 무너진다 —</text>
<text x="903.0" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">각자 다른 방식으로 증명해 들인다.</text>
<text x="698.0" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">'정품 폰'과 '정품 버즈'만</text>
<text x="115.0" y="237.4" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">📱 폰 = Knox Attestation</text>
<text x="383.9" y="234.8" font-size="16.0" font-weight="600" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— &quot;진짜 정품 갤럭시 + 변조/루팅 안 됨&quot;을 하드웨어로 증명 (앱+OS엔 mTLS보다 이게 정석)</text>
<text x="115.0" y="271.4" font-size="18.0" font-weight="800" fill="rgb(109, 40, 217)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">무엇을 증명 · 하드웨어 뿌리</text>
<text x="139.0" y="301.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">① 진짜</text>
<text x="351.3" y="301.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">② 부팅·OS가</text>
<text x="201.0" y="301.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">정품 삼성 갤럭시</text>
<text x="452.4" y="301.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">변조/루팅 안 됨</text>
<text x="139.0" y="337.7" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">신뢰가</text>
<text x="308.8" y="337.7" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">부터 시작 · 기기마다</text>
<text x="195.9" y="337.7" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">공장 제조 시점</text>
<text x="472.3" y="337.7" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">고유 하드웨어 키</text>
<text x="407.0" y="373.9" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(변조방지 금고)에 봉인 ·</text>
<text x="149.0" y="403.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">전송은 TLS</text>
<text x="139.0" y="373.9" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Attestation Key를 Knox Vault</text>
<text x="630.5" y="271.4" font-size="18.0" font-weight="800" fill="rgb(109, 40, 217)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">검사 항목 (Device Health)</text>
<text x="786.1" y="301.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 부트로더→커널</text>
<text x="1084.4" y="301.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">인지 측</text>
<text x="654.5" y="330.7" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">정·검증 · 부트로더 잠김(OEM unlock off) 확인</text>
<text x="654.5" y="301.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Trusted Boot</text>
<text x="932.3" y="301.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">각 단계가 정품 서명</text>
<text x="833.7" y="366.9" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 언락·루팅·커스텀 바이너리 플래시 시</text>
<text x="818.6" y="396.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(복구 불가). 트립되면 삼성페이·보안폴더</text>
<text x="654.5" y="425.3" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">도 영구 차단 → '손댄 기기' 영구 식별</text>
<text x="654.5" y="366.9" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Knox Warranty Bit</text>
<text x="654.5" y="396.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">e-fuse가 0→1 영구</text>
<text x="853.7" y="461.4" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 부팅 후에도 런타임으로</text>
<text x="851.2" y="490.6" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 루트킷·런타임 변조 탐지 (RKP가 커</text>
<text x="654.5" y="519.8" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">널 실시간 보호)</text>
<text x="654.5" y="461.4" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">주기적 커널 측정(PKM)</text>
<text x="1060.8" y="461.4" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">커널 코드·</text>
<text x="654.5" y="490.6" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">핵심 데이터 해시를 측정</text>
<text x="1170.8" y="271.4" font-size="18.0" font-weight="800" fill="rgb(109, 40, 217)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">검증 흐름 (nonce 챌린지-응답)</text>
<text x="1208.8" y="301.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(우리)서버가</text>
<text x="1372.3" y="301.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(1회용 난수) 생성 → 앱에 전달</text>
<text x="1313.8" y="301.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">nonce</text>
<text x="1208.8" y="337.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">앱이 기기</text>
<text x="1492.4" y="337.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">호출(nonce 전달)</text>
<text x="1288.0" y="337.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Knox Attestation API</text>
<text x="1208.8" y="373.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">기기가 검사 결과(부트·루팅·커널·기기 식별)를 모아</text>
<text x="1410.3" y="402.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(nonce 포함)</text>
<text x="1608.4" y="373.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Knox Vault의</text>
<text x="1218.8" y="402.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Attestation Key로 서명</text>
<text x="1446.2" y="438.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">가</text>
<text x="1484.0" y="467.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">검증 →</text>
<text x="1607.8" y="467.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(정품·무결성) 발급</text>
<text x="1208.8" y="438.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Samsung Attestation 서버</text>
<text x="1468.5" y="438.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Attestation Key 인증서 체인(삼성 루트</text>
<text x="1208.8" y="467.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">까지)·nonce 일치·서명·기기 상태</text>
<text x="1541.9" y="467.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">verdict</text>
<text x="1208.8" y="503.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(우리)서버가 verdict로 통과/거부 ·</text>
<text x="1687.2" y="503.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">· 전송 TLS</text>
<text x="1488.5" y="503.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">nonce로 리플레이 차단</text>
<text x="115.0" y="615.9" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🎧 버즈 = mTLS</text>
<text x="115.0" y="651.1" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈는</text>
<text x="319.1" y="651.1" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">로 &quot;</text>
<text x="455.2" y="651.1" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">&quot;임을 증명.</text>
<text x="163.3" y="651.1" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">mTLS 디바이스 인증서</text>
<text x="344.5" y="651.1" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">정품 갤럭시 버즈</text>
<text x="533.3" y="651.1" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(다음 장 S08)</text>
<text x="424.3" y="678.8" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— Knox OS가 없는 작은</text>
<text x="149.0" y="708.0" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">펌웨어라서. 그래서 mTLS로.</text>
<text x="139.0" y="678.8" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Knox Attestation은 버즈엔 안 됨</text>
<text x="139.0" y="744.2" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈는 앱스토어·OS 수정이 없어</text>
<text x="585.6" y="744.2" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 인</text>
<text x="139.0" y="773.4" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">증서면 충분.</text>
<text x="398.3" y="744.2" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">'루팅' 개념이 거의 없음</text>
<text x="139.0" y="809.6" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">펌웨어 무결성은 SoC 시큐어 부트가 담당 (S09)</text>
<text x="702.3" y="611.9" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔑 mTLS vs Knox Attestation</text>
<text x="860.0" y="658.1" font-size="17.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">증명</text>
<text x="1169.3" y="658.1" font-size="17.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">대상</text>
<text x="721.3" y="703.1" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">mTLS</text>
<text x="860.0" y="703.1" font-size="17.0" font-weight="400" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">키 주인이 진짜 그 기기 (신원)</text>
<text x="1169.3" y="703.1" font-size="17.0" font-weight="400" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈</text>
<text x="721.3" y="748.1" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Knox Att.</text>
<text x="860.0" y="748.1" font-size="17.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">정품 갤럭시 + 무변조 (상태)</text>
<text x="1184.0" y="748.1" font-size="17.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">폰</text>
<text x="702.3" y="788.6" font-size="15.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">둘 다</text>
<text x="953.4" y="788.6" font-size="15.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">위 — 개념 일맥상통.</text>
<text x="735.8" y="788.6" font-size="15.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">하드웨어 신뢰근원 + nonce 챌린지</text>
<text x="1288.7" y="610.9" font-size="23.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🚦 서버 접속 정책</text>
<text x="1312.7" y="649.0" font-size="20.0" font-weight="700" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">폰 Knox Attestation ✅</text>
