<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, -apple-system, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="50" y="60" font-size="12" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">03 / 04</text>
  <text x="140" y="62" font-size="22" fill="#111827" font-weight="700">진짜 단독 차별점 4개 + 솔직히 동등하거나 약한 부분</text>
  <rect x="1751" y="46" width="119" height="24" rx="4" fill="#ccfbf1"/>
  <text x="1810.5" y="62" font-size="11" font-weight="700" fill="#0d9488" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">DIFFERENTIATORS</text>
  <line x1="50" y1="88" x2="1870" y2="88" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="112" font-size="13.5" fill="#4b5563">LLM 시대엔 "의도 라우팅"·"세션 연속 대화"는 누구나 한다. 정직하게 BudsAI만 단독으로 가지는 본질적 차별점 4개(기술 3 + 생태계 1)만 남기고,</text>
  <text x="50" y="132" font-size="13.5" fill="#4b5563">동등하거나 약한 부분은 따로 인정한다.</text>
  <rect x="50" y="175" width="1820" height="38" rx="0" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="70.0" y="199" font-size="11" fill="#111827" font-weight="700" text-anchor="middle" letter-spacing="0.03em">#</text>
  <line x1="90" y1="175" x2="90" y2="213" stroke="#e5e7eb" stroke-width="1"/>
  <text x="102" y="199" font-size="11" fill="#111827" font-weight="700" letter-spacing="0.03em">차별 축 (WHAT)</text>
  <line x1="350" y1="175" x2="350" y2="213" stroke="#e5e7eb" stroke-width="1"/>
  <text x="362" y="199" font-size="11" fill="#111827" font-weight="700" letter-spacing="0.03em">어떻게 (HOW)</text>
  <line x1="910" y1="175" x2="910" y2="213" stroke="#e5e7eb" stroke-width="1"/>
  <text x="922" y="199" font-size="11" fill="#111827" font-weight="700" letter-spacing="0.03em">구현 증거 (EVIDENCE)</text>
  <line x1="1230" y1="175" x2="1230" y2="213" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1242" y="199" font-size="11" fill="#111827" font-weight="700" letter-spacing="0.03em">타사가 왜 못 하나 (WHY NONE)</text>
  <rect x="50" y="213" width="1820" height="130" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="70.0" y="245" font-size="14" fill="#0d9488" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">01</text>
  <line x1="90" y1="213" x2="90" y2="343" stroke="#e5e7eb" stroke-width="1"/>
  <text x="102" y="239" font-size="13" fill="#111827" font-weight="700">"이미 들은 사운드"가 컨텍스트</text>
  <line x1="350" y1="213" x2="350" y2="343" stroke="#e5e7eb" stroke-width="1"/>
  <text x="362" y="237" font-size="11.5" fill="#111827">버즈가 출력 PCM 마지막 30초를 Opus로 압축해 링버퍼에 항상 보관. 질문 발생 시 자동 동봉.</text>
  <text x="362" y="255" font-size="11.5" fill="#111827">사용자가 "방금 그거"라고만 해도 시스템이 이미 무엇을 들었는지 알고 있음.</text>
  <line x1="910" y1="213" x2="910" y2="343" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="910" y="213" width="320" height="130" rx="0" fill="#f9fafb"/>
  <line x1="910" y1="213" x2="910" y2="343" stroke="#e5e7eb" stroke-width="1"/>
  <text x="922" y="241" font-size="11.5" fill="#4b5563" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">30s · ~150KB · Opus 16kbps ·</text>
  <text x="922" y="261" font-size="11.5" fill="#4b5563" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Track A 패킷</text>
  <line x1="1230" y1="213" x2="1230" y2="343" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1242" y="237" font-size="11.5" fill="#b91c1c">모든 경쟁사는 사용자 발화 시점부터의 마이크 입력만 캡처. "방금 그 노래"를 다시 캡처하거나 Shazam 같은</text>
  <text x="1242" y="255" font-size="11.5" fill="#b91c1c">앱을 별도 호출해야 함. 이 한 가지가 BudsAI의 진짜 해자.</text>
  <rect x="50" y="343" width="1820" height="130" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="70.0" y="375" font-size="14" fill="#0d9488" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">02</text>
  <line x1="90" y1="343" x2="90" y2="473" stroke="#e5e7eb" stroke-width="1"/>
  <text x="102" y="369" font-size="13" fill="#111827" font-weight="700">호스트 무관 · 앱 설치 0</text>
  <line x1="350" y1="343" x2="350" y2="473" stroke="#e5e7eb" stroke-width="1"/>
  <text x="362" y="367" font-size="11.5" fill="#111827">표준 BT PAN(BNEP) 프로파일만 사용. OS 빌트인 "Bluetooth 테더링" 토글 한</text>
  <text x="362" y="385" font-size="11.5" fill="#111827">번이면 노트북·MP3·TV·차량·eSIM 동글에서 동일 동작. 자사 폰 없어도 모든 핵심 기능</text>
  <text x="362" y="403" font-size="11.5" fill="#111827">그대로.</text>
  <line x1="910" y1="343" x2="910" y2="473" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="910" y="343" width="320" height="130" rx="0" fill="#f9fafb"/>
  <line x1="910" y1="343" x2="910" y2="473" stroke="#e5e7eb" stroke-width="1"/>
  <text x="922" y="371" font-size="11.5" fill="#4b5563" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">BNEP · IETF RFC 3220 · OS 빌트인</text>
  <line x1="1230" y1="343" x2="1230" y2="473" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1242" y="367" font-size="11.5" fill="#b91c1c">AirPods=iPhone, Buds4 Pro=Galaxy, Nothing=Nothing Phone에 강하게</text>
  <text x="1242" y="385" font-size="11.5" fill="#b91c1c">종속 — 기술 문제가 아니라 락인 비즈니스 모델. 시장 6종 중 아무도 의도적으로 풀지 않음.</text>
  <rect x="50" y="473" width="1820" height="130" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="70.0" y="505" font-size="14" fill="#0d9488" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">03</text>
  <line x1="90" y1="473" x2="90" y2="603" stroke="#e5e7eb" stroke-width="1"/>
  <text x="102" y="499" font-size="13" fill="#111827" font-weight="700">버즈 종단 mTLS · Dumb Pipe</text>
  <line x1="350" y1="473" x2="350" y2="603" stroke="#e5e7eb" stroke-width="1"/>
  <text x="362" y="497" font-size="11.5" fill="#111827">디바이스 인증서를 버즈의 Secure Element에 보관. 버즈가 직접 서버와 mTLS 핸드셰이크.</text>
  <text x="362" y="515" font-size="11.5" fill="#111827">호스트는 IP 패킷만 라우팅하므로 평문 페이로드를 못 봄.</text>
  <line x1="910" y1="473" x2="910" y2="603" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="910" y="473" width="320" height="130" rx="0" fill="#f9fafb"/>
  <line x1="910" y1="473" x2="910" y2="603" stroke="#e5e7eb" stroke-width="1"/>
  <text x="922" y="501" font-size="11.5" fill="#4b5563" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">SE + X.509 · TLS 1.3 · Knox</text>
  <text x="922" y="521" font-size="11.5" fill="#4b5563" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Vault 호환</text>
  <line x1="1230" y1="473" x2="1230" y2="603" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1242" y="497" font-size="11.5" fill="#b91c1c">타사는 모두 폰이 평문 페이로드 처리 → 분실 폰·공유 노트북·렌터카 사용 시 음성 노출 위험. 호스트</text>
  <text x="1242" y="515" font-size="11.5" fill="#b91c1c">무관(#02)을 추구하지 않으면 mTLS 종단을 버즈에 둘 동기 자체가 없음.</text>
  <rect x="50" y="603" width="1820" height="130" rx="0" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="70.0" y="635" font-size="14" fill="#0d9488" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">04</text>
  <line x1="90" y1="603" x2="90" y2="733" stroke="#e5e7eb" stroke-width="1"/>
  <text x="102" y="629" font-size="13" fill="#111827" font-weight="700">Galaxy 생태계 자동 통합</text>
  <rect x="102" y="641" width="50" height="18" rx="3" fill="#e0e7ff"/>
  <text x="127" y="654" font-size="10" fill="#1428a0" font-weight="700" text-anchor="middle">생태계</text>
  <line x1="350" y1="603" x2="350" y2="733" stroke="#e5e7eb" stroke-width="1"/>
  <text x="362" y="627" font-size="11.5" fill="#111827">버즈 응답을 Galaxy 컴패니언 앱이 받아 Spotify·Samsung</text>
  <text x="362" y="645" font-size="11.5" fill="#111827">Notes·Calendar·Internet·Watch·Tab·Auto·DeX·SmartThings로</text>
  <text x="362" y="663" font-size="11.5" fill="#111827">자동 라우팅. Bixby Routines가 위치·시간 기반으로 BudsAI 모드 자체를 자동 트리거.</text>
  <line x1="910" y1="603" x2="910" y2="733" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="910" y="603" width="320" height="130" rx="0" fill="#f9fafb"/>
  <line x1="910" y1="603" x2="910" y2="733" stroke="#e5e7eb" stroke-width="1"/>
  <text x="922" y="631" font-size="11.5" fill="#4b5563" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">컴패니언 앱 · Bixby Routines ·</text>
  <text x="922" y="651" font-size="11.5" fill="#4b5563" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">SmartThings · One UI Auto · DeX</text>
  <text x="922" y="671" font-size="11.5" fill="#4b5563" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">· Knox Vault</text>
  <line x1="1230" y1="603" x2="1230" y2="733" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1242" y="627" font-size="11.5" fill="#b91c1c">자사 OS·앱·차량·웨어러블·태블릿·DeX·SE 보안 모듈을 모두 가진 회사는 삼성과 애플뿐. 그런데 애플은</text>
  <text x="1242" y="645" font-size="11.5" fill="#b91c1c">호스트 무관 아키텍처(#02)를 만들 동기 자체가 없음. 두 조건을 동시에 만족하는 회사는 사실상 삼성 하나.</text>
  <rect x="50" y="749" width="1820" height="200" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <rect x="50" y="749" width="4" height="200" rx="2" fill="#b45309"/>
  <text x="70" y="777" font-size="13" fill="#b45309" font-weight="700">솔직 인정 — 차별점이 아닌 영역</text>
  <text x="70" y="809" font-size="12" fill="#78350f">• 의도 자유도 — Gemini Live·Apple Intelligence·ChatGPT 모두 자연어로 임의 의도 처리 가능. BudsAI의 "8개 의도 분류기"는 결국 같은 LLM 시대 패턴이며 단독 우위가 아니다.</text>
  <text x="70" y="837" font-size="12" fill="#78350f">• 세션 연속 대화 — Gemini Live·Apple Intelligence가 이미 인터럽티블 후속 대화를 더 자연스럽게 처리한다. BudsAI의 PrevSessionID는 "직전 사운드 트랙"을 같이 끌고 간다는 점에서만 의미.</text>
  <text x="70" y="865" font-size="12" fill="#78350f">• 실시간 통역 — Buds4 Pro Interpreter·Timekettle·Pixel Buds Pro 2의 Gemini가 동등 또는 더 강함. BudsAI는 8개 의도 중 하나로 처리할 뿐.</text>
  <text x="70" y="893" font-size="12" fill="#78350f">• ANC · 음질 — Sony XM5·AirPods Pro 2가 최고. BudsAI는 차세대 Buds Pro HW에 의존.</text>
</svg>
