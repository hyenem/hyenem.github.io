<text x="1664.2" y="79.7" font-size="18.0" font-weight="700" fill="rgb(0, 116, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.72" xml:space="preserve">CAPTURE · ANC</text>
<text x="88.0" y="75.8" font-size="20.0" font-weight="600" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">S02 · 주변 소리</text>
<text x="88.0" y="122.3" font-size="44.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" letter-spacing="-0.97" xml:space="preserve">녹음도 안 하는데 주변 소리를 듣는다고? — ANC</text>
<text x="88.0" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">소음을 지우려면</text>
<text x="444.3" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(ANC) — 버즈는 어차피 늘 듣고 있고, BudsAI는 그 소리를</text>
<text x="225.3" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">먼저 그 소음을 들어야 한다</text>
<text x="938.0" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">새로 녹음하지 않고 빌릴 뿐.</text>
<text x="168.3" y="231.4" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">ANC(노이즈 캔슬링)가 뭐냐 — &quot;반대 소리로 지운다&quot;</text>
<text x="126.0" y="229.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">1</text>
<text x="115.0" y="266.4" font-size="18.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">소리는 공기의</text>
<text x="309.2" y="266.4" font-size="18.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">. 거기에</text>
<text x="629.3" y="266.4" font-size="18.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">를 더하면, 두 파동이 서로</text>
<text x="843.2" y="266.4" font-size="18.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">돼 조용해진다.</text>
<text x="217.4" y="266.4" font-size="18.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">출렁임(파동)</text>
<text x="369.4" y="266.4" font-size="18.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">정확히 반대로 출렁이는 소리(역위상)</text>
<text x="812.0" y="266.4" font-size="18.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">상쇄</text>
<text x="950.1" y="266.4" font-size="18.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(마루 + 골 = 0)</text>
<text x="674.2" y="303.3" font-size="15.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔊 들어온 소음</text>
<text x="825.9" y="332.2" font-size="30.0" font-weight="800" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">＋</text>
<text x="904.6" y="303.3" font-size="15.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔄 정반대(역위상)</text>
<text x="1066.0" y="332.2" font-size="30.0" font-weight="800" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">＝</text>
<text x="1154.6" y="303.3" font-size="15.0" font-weight="700" fill="rgb(15, 157, 88)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🤫 상쇄 = 조용</text>
<text x="168.3" y="442.6" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">그래서 버즈는 — 바깥 마이크가 늘 켜져 있다</text>
<text x="126.0" y="441.2" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">2</text>
<text x="136.0" y="494.1" font-size="16.0" font-weight="700" fill="rgb(138, 160, 191)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.48" xml:space="preserve">①</text>
<text x="136.0" y="527.3" font-size="22.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🎙️ 바깥 마이크</text>
<text x="136.0" y="559.7" font-size="18.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">주변 소음을 먼저 들음</text>
<text x="358.8" y="533.5" font-size="36.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▶</text>
<text x="422.7" y="494.1" font-size="16.0" font-weight="700" fill="rgb(138, 160, 191)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.48" xml:space="preserve">②</text>
<text x="422.7" y="527.3" font-size="22.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🧠 칩</text>
<text x="422.7" y="559.7" font-size="18.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">역위상 소리 계산</text>
<text x="645.5" y="533.5" font-size="36.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▶</text>
<text x="709.3" y="494.1" font-size="16.0" font-weight="700" fill="rgb(138, 160, 191)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.48" xml:space="preserve">③</text>
<text x="709.3" y="527.3" font-size="22.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔊 스피커</text>
<text x="709.3" y="559.7" font-size="18.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">반대 소리로 상쇄</text>
<text x="115.0" y="615.1" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">핵심:</text>
<text x="506.2" y="615.1" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(안쪽 피드백 마이크는 귀에 남은 소음까지 보정)</text>
<text x="153.0" y="615.1" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">외부 마이크가 상시 켜져 주변 소리를 계속 듣고 있다.</text>
<text x="1049.3" y="441.6" font-size="23.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">그래서 '주변 소리'는 공짜로 이미 있다</text>
<text x="1007.0" y="440.2" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">3</text>
<text x="1020.0" y="478.8" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">ANC를 켜는 한</text>
<text x="1145.3" y="478.8" font-size="20.0" font-weight="700" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">외부 마이크는 늘 돌아간다.</text>
<text x="1020.0" y="515.0" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">그 소리(A-ext)를 BudsAI 컨텍스트로 쓰는 건</text>
<text x="1603.2" y="515.0" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 이미 듣던 걸 활용하는</text>
<text x="1030.0" y="544.1" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">것.</text>
<text x="1383.5" y="515.0" font-size="20.0" font-weight="700" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">추가 마이크·추가 전력 없이</text>
<text x="1020.0" y="580.3" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">이어폰 출력(내부음)도 늘 있으니 →</text>
<text x="1446.9" y="580.3" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">이미 손안에.</text>
<text x="1301.7" y="580.3" font-size="20.0" font-weight="700" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">내부 + 외부 둘 다</text>
<text x="1543.5" y="580.3" font-size="20.0" font-weight="400" fill="rgb(207, 224, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(다음 장부터 이 소리들을 줄이고</text>
<text x="1030.0" y="609.5" font-size="20.0" font-weight="400" fill="rgb(207, 224, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">묶어 보낸다)</text>
<text x="100.0" y="1039.1" font-size="16.0" font-weight="400" fill="rgb(154, 171, 196)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">ANC = Active Noise Cancellation · 피드포워드(바깥 마이크) + 피드백(안쪽 마이크) · 역위상(anti-phase)으로 상쇄</text>
<text x="1744.4" y="1039.7" font-size="18.0" font-weight="700" fill="rgb(154, 171, 196)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">02 / 10</text>
