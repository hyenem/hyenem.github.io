<rect x="88.0" y="256.3" width="500.7" height="695.6" rx="20.0" fill="rgb(255, 255, 255)" stroke="rgb(15, 157, 88)" stroke-width="5.0"/>
<rect x="115.0" y="515.3" width="446.7" height="53.2" rx="13.0" fill="rgb(234, 255, 244)" stroke="rgb(189, 235, 210)" stroke-width="1.0"/>
<rect x="606.7" y="256.3" width="584.2" height="695.6" rx="20.0" fill="rgb(255, 255, 255)" stroke="rgb(109, 40, 217)" stroke-width="5.0"/>
<rect x="633.7" y="587.3" width="530.2" height="53.2" rx="13.0" fill="rgb(233, 241, 255)" stroke="rgb(207, 224, 247)" stroke-width="1.0"/>
<rect x="1208.9" y="256.3" width="623.1" height="695.6" rx="20.0" fill="rgb(255, 255, 255)" stroke="rgb(0, 116, 255)" stroke-width="5.0"/>
<rect x="88.0" y="965.9" width="1744.0" height="54.1" rx="13.0" fill="rgb(22, 38, 63)"/>
<text x="1641.2" y="79.7" font-size="18.0" font-weight="700" fill="rgb(0, 116, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.72" xml:space="preserve">SECURITY · mTLS</text>
<text x="88.0" y="75.8" font-size="20.0" font-weight="600" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">S09 · 보안 ② 인증</text>
<text x="88.0" y="122.3" font-size="44.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" letter-spacing="-0.97" xml:space="preserve">버즈는 어떻게 '진짜'임을 증명할까? — mTLS</text>
<text x="88.0" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">보통 TLS는 손님만 서버를 확인하지만,</text>
<text x="782.0" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 태어날 때 받은 신분증으로</text>
<text x="410.4" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">mTLS는 서버도 &quot;너 진짜 버즈야?&quot;를 묻는다</text>
<text x="1022.0" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">서명 2번·검증 2번.</text>
<text x="111.0" y="219.6" font-size="17.0" font-weight="600" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔒</text>
<text x="287.5" y="219.6" font-size="17.0" font-weight="600" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 일반 TLS는</text>
<text x="438.7" y="219.6" font-size="17.0" font-weight="600" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">인증서로 &quot;진짜 서버?&quot; 확인, mTLS는</text>
<text x="811.8" y="219.6" font-size="17.0" font-weight="600" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">해 서로 검증</text>
<text x="136.0" y="219.6" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">mTLS = 양방향 TLS</text>
<text x="386.1" y="219.6" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">서버만</text>
<text x="686.4" y="219.6" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈도 인증서 제시</text>
<text x="919.3" y="219.6" font-size="17.0" font-weight="600" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🖋️</text>
<text x="1111.9" y="219.6" font-size="17.0" font-weight="600" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 개인키로 '도장(서명)' → 짝인</text>
<text x="1432.8" y="219.6" font-size="17.0" font-weight="600" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(키는 안 드러남)</text>
<text x="944.4" y="219.6" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">신원 증명 = 디지털 서명</text>
<text x="1326.0" y="219.6" font-size="17.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">공개키로만 검증</text>
<text x="115.0" y="306.0" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🌱 Phase 0 · CA 준비</text>
<text x="337.1" y="303.2" font-size="15.0" font-weight="600" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">출시 전 · 딱 한 번</text>
<text x="153.0" y="344.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">삼성이</text>
<text x="337.8" y="344.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">설립 → CA 키쌍 생성:</text>
<text x="153.0" y="373.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">·</text>
<text x="258.2" y="373.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 극비(본사 HSM 금고), 인증서에 도</text>
<text x="153.0" y="402.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">장 찍는 용도</text>
<text x="153.0" y="431.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">·</text>
<text x="258.2" y="431.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 그 도장을 검증하는 열쇠</text>
<text x="209.9" y="344.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">CA(인증 기관)</text>
<text x="163.1" y="373.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">CA 개인키</text>
<text x="163.1" y="431.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">CA 공개키</text>
<text x="400.2" y="467.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">=</text>
<text x="513.8" y="467.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(서버</text>
<text x="153.0" y="496.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">가 처음부터 가진 단 하나)</text>
<text x="153.0" y="467.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">CA 공개키를 서버에 미리 심음</text>
<text x="412.7" y="467.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">신뢰의 뿌리</text>
<text x="138.0" y="546.5" font-size="16.0" font-weight="600" fill="rgb(15, 122, 67)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 모든 버즈의 '보증인'이 준비됨</text>
<text x="633.7" y="306.0" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🏭 Phase 1 · 제조</text>
<text x="812.4" y="303.2" font-size="15.0" font-weight="600" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈마다 · 공장</text>
<text x="671.7" y="344.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">공장이 칩에 &quot;키쌍 만들어&quot; → 칩이</text>
<text x="1026.4" y="344.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">생성:</text>
<text x="671.7" y="373.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">·</text>
<text x="809.5" y="373.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 칩 금고 봉인, 영영 안 나옴</text>
<text x="671.7" y="402.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">·</text>
<text x="809.5" y="402.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 꺼낼 수 있음</text>
<text x="942.7" y="344.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈 키쌍</text>
<text x="681.8" y="373.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔑 버즈 개인키</text>
<text x="681.8" y="402.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔓 버즈 공개키</text>
<text x="671.7" y="438.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">칩이</text>
<text x="987.1" y="438.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">를 공장 서버로 내보냄</text>
<text x="711.3" y="438.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">[버즈 공개키 + 기기ID #ABC123]</text>
<text x="908.2" y="474.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→</text>
<text x="1015.0" y="474.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">발급</text>
<text x="671.7" y="474.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">✍️ CA가 'CA 개인키'로 서명</text>
<text x="926.5" y="474.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">📜 인증서</text>
<text x="671.7" y="503.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">인증서 ≈ {기기ID, 버즈 공개키, 유효기간} + CA 서명 = &quot;이 공</text>
<text x="671.7" y="532.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">개키 = 진짜 정품 버즈 #ABC123&quot; 보증</text>
<text x="858.4" y="568.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(개인키 옆) → 출고</text>
<text x="671.7" y="568.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">인증서를 버즈 칩에 저장</text>
<text x="656.7" y="618.5" font-size="16.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">📦 버즈 안 =</text>
<text x="833.3" y="618.5" font-size="16.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">+</text>
<text x="743.7" y="618.5" font-size="16.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">개인키(봉인)</text>
<text x="843.2" y="618.5" font-size="16.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">인증서(공개키+CA도장)</text>
<text x="1235.9" y="306.0" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔌 Phase 2 · 접속</text>
<text x="1417.8" y="303.2" font-size="15.0" font-weight="600" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">접속마다 · mTLS</text>
<text x="1273.9" y="344.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">서버 → 버즈:</text>
<text x="1650.0" y="344.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(매번 다른 챌린지)</text>
<text x="1381.4" y="344.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">&quot;인증서 줘 + 이 랜덤값에 서명해&quot;</text>
<text x="1273.9" y="380.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈 → 서버:</text>
<text x="1482.4" y="380.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(공개키+CA도장) +</text>
<text x="1273.9" y="409.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(버즈 개인키로)</text>
<text x="1381.4" y="380.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">① 📜 인증서</text>
<text x="1644.3" y="380.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">② ✍️ 챌린지 서명</text>
<text x="1469.9" y="445.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 서버의</text>
<text x="1631.0" y="445.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">로 인증서의 CA 도장</text>
<text x="1283.9" y="474.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">확인 →</text>
<text x="1273.9" y="445.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔍 검증 A · 인증서 검증</text>
<text x="1546.0" y="445.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">CA 공개키</text>
<text x="1336.8" y="474.1" font-size="20.0" font-weight="700" fill="rgb(15, 122, 67)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">이 공개키 = 진짜 정품 버즈 거 ✅</text>
<text x="1451.0" y="510.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 인증서 속</text>
<text x="1640.4" y="510.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">로 챌린지 서명 검증</text>
<text x="1283.9" y="539.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→</text>
<text x="1273.9" y="510.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔍 검증 B · 소유 증명</text>
<text x="1549.4" y="510.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈 공개키</text>
<text x="1297.2" y="539.1" font-size="20.0" font-weight="700" fill="rgb(15, 122, 67)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">개인키도 보유 = 도용 아님 ✅</text>
<text x="1273.9" y="575.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">둘 다 통과 →</text>
<text x="1592.9" y="575.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🎉</text>
<text x="1381.4" y="575.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">정품 버즈 확정 · 접속 허용</text>
<text x="191.0" y="997.6" font-size="18.0" font-weight="600" fill="rgb(207, 227, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">✍️</text>
