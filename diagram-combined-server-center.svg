<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" role="img" aria-label="BudsAI combined flow with Server in the center">
  <style>
    .gr-rect { fill: rgba(20,40,160,0.025); stroke: #c8cee9; stroke-width: 1; stroke-dasharray: 4 4; }
    .gr-rect.others { fill: rgba(190,24,93,0.025); stroke: #f0b4d0; }
    .gr-rect.server { fill: rgba(4,120,87,0.04); stroke: #a7e0c9; stroke-width: 1.5; stroke-dasharray: none; }
    .gr-rect.buds   { fill: rgba(20,40,160,0.04);  stroke: #c8cee9; }
    .gr-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #1428a0; }
    .gr-label.others { fill: #be185d; }
    .gr-label.server { fill: #047857; }
    .gr-label.buds   { fill: #1428a0; }

    .nd-rect { fill: #fff; stroke: #0b1220; stroke-width: 1.5; }
    .nd-rect.blue { stroke: #1428a0; }
    .nd-rect.magenta { stroke: #be185d; }
    .nd-rect.green { stroke: #047857; }
    .nd-rect.solid-blue { fill: #eef0fa; stroke: #1428a0; }
    .nd-rect.solid-green { fill: #d1fae5; stroke: #047857; }
    .nd-rect.dim { fill: #f7f8fa; stroke-dasharray: 4 3; }

    .nd-text { font-family: 'Pretendard', sans-serif; font-size: 12.5px; font-weight: 600; fill: #0b1220; text-anchor: middle; }
    .nd-text.small { font-size: 11px; font-weight: 500; fill: #4b5563; }
    .nd-text.mono { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8a93a3; letter-spacing: 0.04em; }

    .edge { fill: none; stroke: #0b1220; stroke-width: 1.5; }
    .edge.blue { stroke: #1428a0; }
    .edge.magenta { stroke: #be185d; }
    .edge.green { stroke: #047857; }

    .edge-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #4b5563; text-anchor: middle; }
    .edge-label.blue { fill: #1428a0; }
    .edge-label.magenta { fill: #be185d; }
    .edge-label-bg { fill: #f7f8fa; }

    .loop-arrow { fill: none; stroke: #1428a0; stroke-width: 1.5; }

    .side-title { font-family: 'Pretendard', sans-serif; font-size: 16px; font-weight: 800; fill: #0b1220; text-anchor: middle; letter-spacing: -0.01em; }
    .side-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-anchor: middle; }
    .side-badge.req { fill: #1428a0; }
    .side-badge.ret { fill: #047857; }
    .side-badge-bg.req { fill: #eef0fa; }
    .side-badge-bg.ret { fill: #d1fae5; }
  </style>

  <defs>
    <marker id="m-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1220"/>
    </marker>
    <marker id="m-ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1428a0"/>
    </marker>
    <marker id="m-ah-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#be185d"/>
    </marker>
    <marker id="m-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ========== Top titles for each half ========== -->
  <rect class="side-badge-bg req" x="350" y="14" width="80" height="22" rx="11"/>
  <text class="side-badge req" x="390" y="29">← REQUEST</text>
  <text class="side-title" x="490" y="30">요청 흐름 (Buds → Server)</text>

  <rect class="side-badge-bg ret" x="1340" y="14" width="74" height="22" rx="11"/>
  <text class="side-badge ret" x="1377" y="29">RETURN →</text>
  <text class="side-title" x="1500" y="30">응답 흐름 (Server → Buds)</text>

  <!-- ========== Subtle pivot indicator behind server ========== -->
  <line x1="840" y1="36" x2="840" y2="600" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ====================================================== -->
  <!-- LEFT — REQUEST                                          -->
  <!-- ====================================================== -->

  <!-- Group: Buds (origin) -->
  <rect class="gr-rect buds" x="40" y="250" width="220" height="160" rx="10" ry="10"/>
  <text class="gr-label" x="54" y="274">🎧 Buds (origin)</text>

  <rect class="nd-rect blue" x="60" y="300" width="80" height="80" rx="6" ry="6"/>
  <text class="nd-text" x="100" y="336">버퍼링</text>
  <path class="loop-arrow" d="M 86 352 a 14 10 0 1 0 28 0 a 14 10 0 1 0 -28 0" marker-end="url(#m-ah-blue)" stroke-dasharray="3 2"/>
  <text class="nd-text small" x="100" y="372">(상시)</text>

  <path class="edge" d="M 140 340 L 156 340" marker-end="url(#m-ah)"/>
  <text class="edge-label" x="148" y="332">interaction</text>

  <rect class="nd-rect blue" x="160" y="315" width="80" height="50" rx="6" ry="6"/>
  <text class="nd-text" x="200" y="346">패킷 생성</text>

  <!-- Group: Galaxy Phone (request stage) -->
  <rect class="gr-rect" x="300" y="50" width="320" height="200" rx="10" ry="10"/>
  <text class="gr-label" x="314" y="74">📱 Galaxy Phone</text>

  <rect class="nd-rect blue" x="320" y="90" width="160" height="120" rx="6" ry="6"/>
  <text class="nd-text" x="400" y="130">BudsAI request</text>
  <text class="nd-text" x="400" y="152">local DB 저장</text>
  <text class="nd-text small mono" x="400" y="180">SQLite · status=wait</text>

  <path class="edge" d="M 480 150 L 506 150" marker-end="url(#m-ah)"/>
  <text class="edge-label" x="493" y="142">인터넷</text>
  <text class="edge-label" x="493" y="168">연결</text>

  <rect class="nd-rect blue" x="510" y="115" width="100" height="70" rx="6" ry="6"/>
  <text class="nd-text" x="560" y="145">패킷 생성</text>
  <text class="nd-text small mono" x="560" y="166">HTTPS·JWT</text>

  <!-- Group: Others (request stage) -->
  <rect class="gr-rect others" x="300" y="270" width="320" height="140" rx="10" ry="10"/>
  <text class="gr-label others" x="314" y="294">💻 Others (host)</text>

  <rect class="nd-rect magenta dim" x="400" y="310" width="200" height="65" rx="6" ry="6"/>
  <text class="nd-text" x="500" y="338">BNEP · IP 라우팅</text>
  <text class="nd-text small mono" x="500" y="360">passthrough only</text>

  <!-- ====================================================== -->
  <!-- CENTER — SERVER (single shared)                         -->
  <!-- ====================================================== -->
  <rect class="gr-rect server" x="640" y="40" width="400" height="540" rx="12" ry="12"/>
  <text class="gr-label server" x="654" y="64">☁️ Server</text>

  <rect class="nd-rect green" x="680" y="86" width="320" height="44" rx="6" ry="6"/>
  <text class="nd-text" x="840" y="114">Audio decomp</text>
  <path class="edge green" d="M 840 130 L 840 150" marker-end="url(#m-ah-green)"/>

  <rect class="nd-rect green" x="680" y="152" width="320" height="44" rx="6" ry="6"/>
  <text class="nd-text" x="840" y="180">사용자 음성 처리</text>
  <path class="edge green" d="M 840 196 L 840 216" marker-end="url(#m-ah-green)"/>

  <rect class="nd-rect green" x="680" y="218" width="320" height="44" rx="6" ry="6"/>
  <text class="nd-text" x="840" y="246">답변 생성 (LLM)</text>

  <path class="edge green" d="M 840 262 L 840 286"/>
  <path class="edge green" d="M 840 286 L 750 286 L 750 316" marker-end="url(#m-ah-green)"/>
  <path class="edge green" d="M 840 286 L 930 286 L 930 316" marker-end="url(#m-ah-green)"/>
  <text class="edge-label" style="fill:#1428a0;" x="750" y="304">galaxy</text>
  <text class="edge-label" style="fill:#be185d;" x="930" y="304">others</text>

  <rect class="nd-rect blue" x="680" y="322" width="140" height="50" rx="6" ry="6"/>
  <text class="nd-text" x="750" y="352">action item 생성</text>

  <rect class="nd-rect magenta" x="860" y="322" width="140" height="50" rx="6" ry="6"/>
  <text class="nd-text" x="930" y="352">TTS 생성</text>

  <path class="edge green" d="M 750 372 L 750 398 L 840 398 L 840 422" marker-end="url(#m-ah-green)"/>
  <path class="edge green" d="M 930 372 L 930 398 L 840 398"/>

  <rect class="nd-rect solid-green" x="680" y="424" width="320" height="50" rx="6" ry="6"/>
  <text class="nd-text" x="840" y="454" style="fill:#047857;">패킷 생성 (응답)</text>

  <!-- ====================================================== -->
  <!-- RIGHT — RETURN                                          -->
  <!-- ====================================================== -->

  <!-- Group: Galaxy Phone (return stage) -->
  <rect class="gr-rect" x="1080" y="50" width="540" height="240" rx="10" ry="10"/>
  <text class="gr-label" x="1094" y="74">📱 Galaxy Phone</text>

  <rect class="nd-rect blue" x="1100" y="100" width="220" height="140" rx="6" ry="6"/>
  <text class="nd-text" x="1210" y="140">DB mapping 후</text>
  <text class="nd-text" x="1210" y="162">답변 &amp; action item</text>
  <text class="nd-text" x="1210" y="184">저장</text>
  <text class="nd-text small mono" x="1210" y="216">match by session_id</text>

  <rect class="nd-rect blue" x="1360" y="110" width="240" height="56" rx="6" ry="6"/>
  <text class="nd-text" x="1480" y="134">3rd party action item</text>
  <text class="nd-text small" x="1480" y="152">후속 처리 (Calendar · SmartThings…)</text>

  <rect class="nd-rect blue" x="1360" y="188" width="240" height="48" rx="6" ry="6"/>
  <text class="nd-text" x="1480" y="210">TTS 생성</text>
  <text class="nd-text small mono" x="1480" y="228">VITS · 24kbps Opus</text>

  <path class="edge blue" d="M 1320 140 L 1360 140" marker-end="url(#m-ah-blue)"/>
  <path class="edge blue" d="M 1320 210 L 1360 210" marker-end="url(#m-ah-blue)"/>

  <!-- Group: Others (return stage) -->
  <rect class="gr-rect others" x="1080" y="310" width="540" height="120" rx="10" ry="10"/>
  <text class="gr-label others" x="1094" y="334">💻 Others</text>

  <rect class="nd-rect magenta dim" x="1220" y="346" width="260" height="56" rx="6" ry="6"/>
  <text class="nd-text" x="1350" y="370">호스트 통과 (passthrough)</text>
  <text class="nd-text small mono" x="1350" y="390">BT PAN · 페이로드 비공개</text>

  <!-- Group: Buds (TTS output) -->
  <rect class="gr-rect buds" x="1660" y="250" width="220" height="160" rx="10" ry="10"/>
  <text class="gr-label" x="1674" y="274">🎧 Buds (output)</text>

  <rect class="nd-rect solid-blue" x="1680" y="300" width="180" height="80" rx="6" ry="6"/>
  <text class="nd-text" x="1770" y="336" style="fill:#1428a0;">TTS 출력</text>
  <text class="nd-text small mono" x="1770" y="358">Opus decode → speaker</text>

  <!-- ====================================================== -->
  <!-- ARROWS                                                   -->
  <!-- ====================================================== -->

  <!-- LEFT: Buds(origin) → Phone(req) -->
  <path class="edge blue" d="M 240 330 C 280 330, 280 150, 320 150" marker-end="url(#m-ah-blue)"/>
  <rect class="edge-label-bg" x="248" y="220" width="74" height="14" rx="3"/>
  <text class="edge-label blue" x="285" y="231">BT (audio)</text>

  <!-- LEFT: Buds(origin) → Others(req) -->
  <path class="edge magenta" d="M 240 350 C 290 350, 290 342, 400 342" marker-end="url(#m-ah-magenta)"/>
  <rect class="edge-label-bg" x="262" y="346" width="76" height="14" rx="3"/>
  <text class="edge-label magenta" x="300" y="357">BT PAN</text>

  <!-- LEFT: Phone(req) → Server -->
  <path class="edge blue" d="M 610 150 C 625 150, 625 108, 680 108" marker-end="url(#m-ah-blue)"/>
  <rect class="edge-label-bg" x="608" y="118" width="78" height="14" rx="3"/>
  <text class="edge-label blue" x="647" y="129">HTTPS · JWT</text>

  <!-- LEFT: Others(req) → Server -->
  <path class="edge magenta" d="M 600 342 C 625 342, 625 130, 680 130" marker-end="url(#m-ah-magenta)"/>
  <rect class="edge-label-bg" x="603" y="250" width="110" height="14" rx="3"/>
  <text class="edge-label magenta" x="658" y="261">HTTPS · mTLS E2E</text>

  <!-- RIGHT: Server → Phone(return) -->
  <path class="edge green" d="M 1000 440 C 1040 440, 1040 170, 1100 170" marker-end="url(#m-ah-green)"/>
  <rect class="edge-label-bg" x="1006" y="178" width="68" height="14" rx="3"/>
  <text class="edge-label" x="1040" y="189" style="fill:#047857;">resp+act</text>

  <!-- RIGHT: Server → Others(return) -->
  <path class="edge green" d="M 1000 455 C 1100 455, 1100 374, 1220 374" marker-end="url(#m-ah-green)"/>
  <rect class="edge-label-bg" x="1014" y="402" width="60" height="14" rx="3"/>
  <text class="edge-label" x="1044" y="413" style="fill:#047857;">TTS pkt</text>

  <!-- RIGHT: Phone(return) TTS → Buds(out) -->
  <path class="edge blue" d="M 1600 212 C 1630 212, 1630 320, 1680 320" marker-end="url(#m-ah-blue)"/>
  <rect class="edge-label-bg" x="1622" y="234" width="68" height="14" rx="3"/>
  <text class="edge-label blue" x="1656" y="245">BT · TTS</text>

  <!-- RIGHT: Others(return) → Buds(out) -->
  <path class="edge magenta" d="M 1480 374 C 1570 374, 1570 350, 1680 350" marker-end="url(#m-ah-magenta)"/>
  <rect class="edge-label-bg" x="1582" y="338" width="84" height="14" rx="3"/>
  <text class="edge-label magenta" x="1624" y="349">BT PAN · TTS</text>

  <!-- ========== Bottom footer ========== -->
  <text x="960" y="620" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a93a3" text-anchor="middle">
    🎧 Buds 는 같은 한 쌍 — 왼쪽은 트리거 직후 모습, 오른쪽은 답변 받는 모습   ·   ☁️ Server 는 한 인스턴스가 양방향 모두 처리
  </text>
</svg>
