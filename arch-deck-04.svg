<text x="1698.8" y="79.7" font-size="18.0" font-weight="700" fill="rgb(0, 116, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.72" xml:space="preserve">CAPTURE HW</text>
<text x="88.0" y="75.8" font-size="20.0" font-weight="600" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">S04 · 캡처 하드웨어</text>
<text x="88.0" y="122.3" font-size="44.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" letter-spacing="-0.97" xml:space="preserve">소음 제거와 기억을 동시에? — ANC·DMA·링버퍼</text>
<text x="88.0" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">소음을 지우는 일과 기억하는 일은 보통 부딪힌다 — 소리를 메모리에</text>
<text x="891.5" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(복사 0) 충돌 없이 동시에.</text>
<text x="649.5" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">한 번만 적고 둘이 같이 읽으면</text>
<text x="168.3" y="232.4" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">DMA(Direct Memory Access, 직접 메모리 접근)가 소리를 적어두고, 둘이 읽는다</text>
<text x="126.0" y="230.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">1</text>
<text x="941.4" y="231.4" font-size="19.6" font-weight="800" fill="rgb(0, 89, 201)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">복사 0</text>
<text x="359.4" y="282.4" font-size="18.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔊 내부(이어폰 출력)</text>
<text x="517.6" y="282.8" font-size="14.0" font-weight="700" fill="rgb(138, 160, 191)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">I2S (Inter-IC Sound)</text>
<text x="514.8" y="318.1" font-size="15.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▼</text>
<text x="395.9" y="353.9" font-size="18.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">DMA 자동기록 → PCM 버퍼(내부)</text>
<text x="1302.0" y="282.4" font-size="18.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🎙️ 외부(ANC 마이크)</text>
<text x="1467.8" y="282.8" font-size="14.0" font-weight="700" fill="rgb(138, 160, 191)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">ADC</text>
<text x="1389.8" y="318.1" font-size="15.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▼</text>
<text x="1270.9" y="353.9" font-size="18.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">DMA 자동기록 → PCM 버퍼(외부)</text>
<text x="1188.6" y="406.9" font-size="18.0" font-weight="700" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">⚡ ANC 엔진 — 역위상 소음제거 (즉각 · 외부음 같이 읽음)</text>
<text x="852.1" y="449.1" font-size="17.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▼   같은 주소 읽기 (복사 0)   ▼</text>
<text x="800.9" y="496.0" font-size="20.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🗜️ LC3 인코더 — 자기 속도로 읽어 압축</text>
<text x="917.8" y="540.1" font-size="17.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▼             ▼</text>
<text x="427.7" y="585.9" font-size="18.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔊 A-int 링버퍼</text>
<text x="551.7" y="586.3" font-size="16.0" font-weight="600" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">내부 30초</text>
<text x="1300.4" y="585.9" font-size="18.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🎙️ A-ext 링버퍼</text>
<text x="1429.0" y="586.3" font-size="16.0" font-weight="600" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">외부 30초</text>
<text x="115.0" y="638.2" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 같은 데이터를</text>
<text x="331.7" y="638.2" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">가 사용. DMA 덕에</text>
<text x="688.5" y="638.2" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ ANC 필터 + LC3 인코딩에 집중.</text>
<text x="245.2" y="638.2" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">다른 소비자</text>
<text x="479.1" y="638.2" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">CPU는 복사 노동에서 해방</text>
<text x="168.3" y="727.6" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">30초 순환(ring) 버퍼 — write가 돌며 가장 오래된 칸부터 덮어씀</text>
<text x="126.0" y="726.2" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">2</text>
<text x="163.8" y="819.4" font-size="15.0" font-weight="700" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔊 A-int</text>
<text x="168.1" y="844.0" font-size="23.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">30초</text>
<text x="315.0" y="787.3" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">파란 호 = 보관 중인</text>
<text x="437.9" y="787.3" font-size="16.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">직전 30초</text>
<text x="315.0" y="815.7" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">빨간 칸 =</text>
<text x="500.6" y="815.7" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 다음에 덮임</text>
<text x="374.6" y="815.7" font-size="16.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">가장 오래된 프레임</text>
<text x="291.0" y="844.1" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▼ write가</text>
<text x="419.4" y="844.1" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">으로 돌며 오래된 칸부터 갱신</text>
<text x="364.0" y="844.1" font-size="16.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">시계방향</text>
<text x="291.0" y="872.5" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">한 칸 = LC3 프레임(10ms) · 30초 ≈ 3000칸</text>
<text x="1021.9" y="819.4" font-size="15.0" font-weight="700" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🎙️ A-ext</text>
<text x="1028.1" y="844.0" font-size="23.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">30초</text>
<text x="1151.0" y="801.5" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">외부(주변음) 전용 —</text>
<text x="1400.8" y="801.5" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">으로 돈다</text>
<text x="1286.1" y="801.5" font-size="16.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">A-int와 각자 독립</text>
<text x="1151.0" y="829.9" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">같은 순환 방식: 꽉 차면</text>
<text x="1425.6" y="829.9" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">오래된 칸 덮음</text>
<text x="1299.6" y="829.9" font-size="16.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">끝과 처음이 이어져</text>
<text x="1151.0" y="858.3" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">늘</text>
<text x="1234.8" y="858.3" font-size="16.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">만 유지 (오래된 소리는 사라짐)</text>
<text x="1168.8" y="858.3" font-size="16.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">최근 30초</text>
<text x="138.0" y="956.5" font-size="21.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">📸 트리거 → 두 버퍼의</text>
<text x="488.6" y="956.5" font-size="21.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">스냅샷 (A-int + A-ext 동시 첨부)</text>
<text x="332.3" y="956.5" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">직전 30초를 함께</text>
<text x="111.0" y="1054.0" font-size="21.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🧑‍🏫</text>
<text x="216.4" y="1054.0" font-size="21.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">: 마이크 소리를 칠판</text>
<text x="551.8" y="1054.0" font-size="21.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">, ANC 담당·압축 담당이 그 칠판을</text>
<text x="924.9" y="1054.0" font-size="21.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 따로 두 번 안 적으니 동시에 일해도 안 부딪힘. 칠판은 30초짜리</text>
<text x="1520.5" y="1054.0" font-size="21.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">이라 꽉 차면 가장 오래된 걸 지우고</text>
<text x="121.5" y="1084.4" font-size="21.0" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">새로 적는다.</text>
<text x="139.0" y="1054.0" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">칠판 비유</text>
<text x="387.3" y="1054.0" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">한 곳에 한 번만 적고</text>
<text x="837.0" y="1054.0" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">같이 본다</text>
<text x="1466.0" y="1054.0" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">돌림판</text>
<text x="1744.4" y="1039.7" font-size="18.0" font-weight="700" fill="rgb(154, 171, 196)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">04 / 10</text>
</svg>