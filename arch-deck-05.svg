<text x="1779.4" y="79.7" font-size="18.0" font-weight="700" fill="rgb(0, 116, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.72" xml:space="preserve">VAD</text>
<text x="88.0" y="75.8" font-size="20.0" font-weight="600" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">S05 · 발화 끝 감지</text>
<text x="88.0" y="122.3" font-size="44.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" letter-spacing="-0.97" xml:space="preserve">말이 끝난 걸 버즈가 어떻게 알까? — VAD</text>
<text x="88.0" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈4 프로는 이미</text>
<text x="388.8" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">을 안다 — 소리가 아니라</text>
<text x="675.4" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">을 보기에, 같은 센서로</text>
<text x="932.2" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">을 정확히 잡는다.</text>
<text x="243.8" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">'내가 말하는 순간'</text>
<text x="597.9" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">턱뼈 진동</text>
<text x="864.6" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">'말의 끝'</text>
<text x="168.3" y="231.4" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">&quot;Voice Detect&quot; — 버즈4 프로의 기존 기능</text>
<text x="126.0" y="229.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">1</text>
<text x="139.0" y="268.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">음악 듣는 중 말을 시작하면</text>
<text x="643.5" y="268.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 상대 말이 잘 들림.</text>
<text x="354.2" y="268.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">자동으로 음악 볼륨↓ + 주변음 모드</text>
<text x="139.0" y="304.7" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">말을 멈추고</text>
<text x="549.8" y="304.7" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">.</text>
<text x="235.5" y="304.7" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">일정 시간(5·10·15초 설정) 뒤 자동 원복</text>
<text x="301.1" y="340.9" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">시 동작 · Galaxy Wearable 앱에서 켬.</text>
<text x="139.0" y="340.9" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">양쪽 버즈 모두 착용</text>
<text x="139.0" y="377.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ &quot;착용자가 말하는 중인지&quot; 감지를</text>
<text x="506.0" y="377.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">중 (새 기술 아님).</text>
<text x="422.2" y="377.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">이미 양산</text>
<text x="168.3" y="471.1" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">기술 — VPU(Voice Pickup Unit) 골전도 감지</text>
<text x="126.0" y="469.7" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">2</text>
<text x="139.0" y="508.3" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈4 프로 센서 = 가속도계·자이로·홀·근접·터치 +</text>
<text x="579.0" y="508.3" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">. Voice Detect는 양쪽 버즈의 이</text>
<text x="242.4" y="537.4" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">로 발화를 잡는다.</text>
<text x="538.1" y="508.3" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">VPU</text>
<text x="844.3" y="508.3" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">VPU(음</text>
<text x="139.0" y="537.4" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">성 감지 센서)</text>
<text x="139.0" y="573.6" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">VPU =</text>
<text x="569.8" y="573.6" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 공기로 오는 소리가 아니라, 말할 때</text>
<text x="364.9" y="602.8" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">을 전기신호로 변환.</text>
<text x="200.7" y="573.6" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">단일축 압전(piezoelectric) 보이스 가속도계</text>
<text x="866.2" y="573.6" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">턱·두</text>
<text x="139.0" y="602.8" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">개골을 타고 오는 골전도 진동</text>
<text x="139.0" y="639.0" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">골전도 신호라</text>
<text x="482.3" y="639.0" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 착용자 목소리만 픽업. (마이크 '소리'가 아니라 '진동'을</text>
<text x="149.0" y="668.2" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">봄)</text>
<text x="252.8" y="639.0" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">주변 소음(공기 전파)에 면역</text>
<text x="1049.3" y="230.4" font-size="23.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">BudsAI는 어디에 쓰나 — '말 끝' 감지</text>
<text x="1007.0" y="228.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">3</text>
<text x="1020.0" y="267.5" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈4 프로: 말하면 →</text>
<text x="1327.1" y="267.5" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">에 사용.</text>
<text x="1196.9" y="267.5" font-size="20.0" font-weight="700" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">주변음 모드 전환</text>
<text x="1020.0" y="303.7" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">BudsAI: 트리거 후 녹음하다가 그 센서로</text>
<text x="1593.9" y="303.7" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">.</text>
<text x="1342.9" y="303.7" font-size="20.0" font-weight="700" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">'말이 끝났다'를 감지해 자동 종료</text>
<text x="1020.0" y="339.9" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">'끝' 버튼 불필요 —</text>
<text x="1277.8" y="339.9" font-size="20.0" font-weight="400" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">면 종료.</text>
<text x="1171.0" y="339.9" font-size="20.0" font-weight="700" fill="rgb(255, 255, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">침묵 800ms</text>
<text x="1050.3" y="432.9" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">왜 이 방식이 딱인가</text>
<text x="1008.0" y="431.5" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">4</text>
<text x="1021.0" y="470.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">녹음 중에도 이어폰엔 음악이 나오고 주변은 시끄러울 수 있다.</text>
<text x="1021.0" y="506.3" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">소리만 보는 방식은 &quot;아직 말하는 중&quot;으로</text>
<text x="1387.4" y="506.3" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 안 끊김.</text>
<text x="1342.8" y="506.3" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">착각</text>
<text x="1274.2" y="542.4" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 말 끝을 정확히.</text>
<text x="1021.0" y="542.4" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">턱 진동만 보는 가속도계는 면역</text>
<text x="1014.0" y="597.4" font-size="21.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🎵 음악 ✕</text>
<text x="1014.0" y="621.8" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">면역</text>
<text x="1144.7" y="597.4" font-size="21.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🗣️ 주변소음 ✕</text>
<text x="1144.7" y="621.8" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">면역</text>
<text x="1311.7" y="597.4" font-size="21.0" font-weight="800" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🙂 내 목소리 ✓</text>
<text x="1311.7" y="621.8" font-size="17.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">감지</text>
<text x="117.0" y="963.9" font-size="18.5" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">💡</text>
<text x="235.9" y="963.9" font-size="18.5" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— Pro 라인(Pro·2 Pro·3 Pro·4 Pro):</text>
<text x="854.2" y="963.9" font-size="18.5" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 양쪽 끼고 ANC로 음악 들으며 말하면</text>
<text x="1366.2" y="963.9" font-size="18.5" font-weight="600" fill="rgb(0, 89, 201)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">.</text>
<text x="142.4" y="963.9" font-size="18.5" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">직접 써보기</text>
<text x="519.6" y="963.9" font-size="18.5" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">소음 제어 → '주변 소리 듣기로 자동 전환' ON</text>
<text x="1144.1" y="963.9" font-size="18.5" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">자동으로 볼륨↓ + 주변음 전환</text>
<text x="117.0" y="992.6" font-size="15.0" font-weight="600" fill="rgb(91, 122, 168)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">예전 'Voice detect'가 이 이름으로 통합 · One UI 8.0+는 폰 설정→버즈, 그 외엔 Galaxy Wearable · 복귀 5/10/15초</text>
<text x="100.0" y="1037.5" font-size="14.0" font-weight="400" fill="rgb(154, 171, 196)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">근거: 삼성 갤럭시 버즈 Pro/4 Pro</text>
<text x="373.4" y="1037.5" font-size="14.0" font-weight="400" fill="rgb(154, 171, 196)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(현재 UI명 '주변 소리 듣기로 자동 전환', 공식) · 센서 가속도계·자이로·홀·근접·터치·VPU · VPU = 압전 골전도 보이스 가속도계 → 이 메커니즘을 '발화 끝' 감지에 재활용</text>
<text x="289.1" y="1037.5" font-size="14.0" font-weight="700" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Voice Detect</text>
<text x="1744.4" y="1039.7" font-size="18.0" font-weight="700" fill="rgb(154, 171, 196)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">05 / 10</text>
</svg>