<text x="1698.8" y="79.7" font-size="18.0" font-weight="700" fill="rgb(0, 116, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.72" xml:space="preserve">BUDS LOGIC</text>
<text x="88.0" y="75.8" font-size="20.0" font-weight="600" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">S01 · 버즈 내부</text>
<text x="88.0" y="122.3" font-size="44.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" letter-spacing="-0.97" xml:space="preserve">버즈 안에서는 무슨 일이 벌어질까?</text>
<text x="88.0" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">사용자는 아무것도 안 하지만</text>
<text x="610.3" y="163.9" font-size="21.0" font-weight="500" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 늘 '최근 30초'를 쥐고, 물으면 녹음·포장·전송하고 답을 재생한다.</text>
<text x="326.3" y="163.9" font-size="21.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버즈의 기억은 한순간도 안 멈춘다</text>
<text x="115.0" y="233.4" font-size="23.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔁 늘 기억하기 — 상시 버퍼링</text>
<text x="115.0" y="271.5" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">켜져 있는 동안 늘 귀를 열어둔다. 지금 들어오는 소리를</text>
<text x="220.0" y="300.7" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">— 오래된 건 지우고 새 걸로 덮어쓰며 &quot;방금 30초&quot;를 손</text>
<text x="115.0" y="329.9" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">에 쥔다.</text>
<text x="545.5" y="271.5" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">항상 '최근 30</text>
<text x="115.0" y="300.7" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">초'만큼 기억</text>
<text x="139.0" y="371.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔊</text>
<text x="200.6" y="371.1" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(이어폰 출력) → 링버퍼</text>
<text x="166.0" y="371.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">내부</text>
<text x="390.9" y="371.1" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">A-int</text>
<text x="139.0" y="407.3" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🎙️</text>
<text x="200.6" y="407.3" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(주변음, ANC〔Active Noise Cancellation, 능동 소음 제</text>
<text x="139.0" y="436.4" font-size="20.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">어〕 마이크) → 링버퍼</text>
<text x="166.0" y="407.3" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">외부</text>
<text x="312.2" y="436.4" font-size="20.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">A-ext</text>
<text x="115.0" y="478.8" font-size="19.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">헛일 안 하기 — 내부음 처리 분기</text>
<text x="360.2" y="478.9" font-size="14.0" font-weight="400" fill="rgb(138, 160, 191)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(LC3 = Low Complexity Communication Codec)</text>
<text x="132.0" y="526.8" font-size="19.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">🔊 내부 소리(이어폰 출력)</text>
<text x="165.0" y="617.5" font-size="18.0" font-weight="700" fill="rgb(15, 122, 67)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">이미 LC3 (= LE Audio〔Low Energy Audio〕)?</text>
<text x="540.2" y="617.5" font-size="18.0" font-weight="900" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▶</text>
<text x="580.3" y="579.5" font-size="18.0" font-weight="700" fill="rgb(15, 157, 88)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">그대로 보</text>
<text x="580.3" y="600.5" font-size="18.0" font-weight="700" fill="rgb(15, 157, 88)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">관 ·</text>
<text x="589.3" y="652.5" font-size="18.0" font-weight="700" fill="rgb(15, 157, 88)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">✅</text>
<text x="580.3" y="624.5" font-size="18.0" font-weight="700" fill="rgb(15, 122, 67)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">재압축 0</text>
<text x="165.0" y="709.5" font-size="18.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">아니면 (A2DP·아날로그)</text>
<text x="365.6" y="709.5" font-size="18.0" font-weight="900" fill="rgb(0, 116, 255)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">▶</text>
<text x="405.7" y="709.5" font-size="18.0" font-weight="700" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">PCM → LC3 압축</text>
<text x="111.0" y="802.6" font-size="20.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">핵심 수치</text>
<text x="111.0" y="833.8" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">링버퍼</text>
<text x="215.6" y="833.8" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">· 발화</text>
<text x="372.6" y="833.8" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">· 침묵</text>
<text x="488.9" y="833.8" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">종료</text>
<text x="165.0" y="833.8" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">30초</text>
<text x="258.1" y="833.8" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">500ms~8초</text>
<text x="415.1" y="833.8" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">800ms</text>
<text x="742.6" y="226.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">1</text>
<text x="783.0" y="219.3" font-size="21.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">IDLE 대기</text>
<text x="987.0" y="218.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">겉으론 쉬는 듯하지만 '기억하기'는 계속 돌아간다.</text>
<text x="742.6" y="305.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">2</text>
<text x="783.0" y="298.3" font-size="21.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">트리거</text>
<text x="987.0" y="297.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">버튼을</text>
<text x="1111.1" y="297.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">(롱프레스 2초) = &quot;지금부터 들을게&quot; 신호.</text>
<text x="1041.0" y="297.7" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">길게 누름</text>
<text x="742.6" y="384.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">3</text>
<text x="783.0" y="380.3" font-size="21.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">ARMED 🔔</text>
<text x="987.0" y="376.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">&quot;</text>
<text x="1010.6" y="376.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">&quot;(150ms) 소리로 준비됐다고 알림. 이제 말하면 됨.</text>
<text x="994.2" y="376.7" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">띵</text>
<text x="742.6" y="463.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">4</text>
<text x="783.0" y="459.3" font-size="21.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">RECORDING 🗣️</text>
<text x="987.0" y="455.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">내가 질문을 말하기 시작하면 그 말(Track B)을 담기 시작.</text>
<text x="742.6" y="542.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">5</text>
<text x="783.0" y="535.3" font-size="21.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">VAD 종료</text>
<text x="1318.0" y="534.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">을 잡아 자동 종료(침묵 800ms). 시끄러워도 정확.</text>
<text x="987.0" y="534.7" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">발화 끝(VAD, Voice Activity Detection)</text>
<text x="742.6" y="621.9" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">6</text>
<text x="783.0" y="617.3" font-size="21.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">PACKAGING 📦</text>
<text x="987.0" y="613.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">듣던 소리(내부)+주변(외부)+질문을 한 봉투에 + &quot;</text>
<text x="1530.1" y="613.7" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">&quot; 쪽지(SBAP, Samsung BudsAI</text>
<text x="996.5" y="640.3" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">Protocol).</text>
<text x="1358.8" y="613.7" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">BudsAI한테 물어봐 줘</text>
<text x="742.6" y="714.1" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">7</text>
<text x="783.0" y="709.5" font-size="21.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">SEND 🔒</text>
<text x="987.0" y="705.9" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">아무도 못 열게</text>
<text x="1325.6" y="705.9" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">→ 폰·노트북 거쳐 서버로. 거쳐 가는 기기는 내용 못 봄.</text>
<text x="1099.8" y="705.9" font-size="19.0" font-weight="700" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">봉인(mTLS, 상호 인증 TLS)</text>
<text x="742.6" y="793.1" font-size="18.0" font-weight="800" fill="rgb(255, 255, 255)" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">8</text>
<text x="783.0" y="788.5" font-size="21.0" font-weight="800" fill="rgb(22, 38, 63)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">WAIT ⏳</text>
<text x="987.0" y="784.9" font-size="19.0" font-weight="400" fill="rgb(84, 100, 125)" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" xml:space="preserve">서버가 처리하는 동안 응답을 기다림.</text>
